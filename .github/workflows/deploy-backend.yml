name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      sync_content:
        description: 'Explicitly sync article/category data to MongoDB'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate backend JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax-check backend
        working-directory: backend
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/seed.js
          node --check src/vercel/client.js
          node --check src/vercel/projects.js
          node --check src/vercel/deployments.js
          node --check src/vercel/index.js
          node --check scripts/vercel-control.mjs
          node --check scripts/vercel-mcp.mjs

      - name: Validate VPS overflow monitor
        run: bash -n scripts/vps-overflow-router.sh

      - name: Determine whether content sync is required
        id: content_sync
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_SYNC_CONTENT: ${{ inputs.sync_content }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=${MANUAL_SYNC_CONTENT:-false}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -Eq '^(backend/src/data\.js|backend/src/.*Content\.js|backend/src/distributedSystemsConcepts\.js|backend/src/distributedSystemComponents\.js|backend/src/contentSchema\.js|backend/src/seed\.js)$'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Ubuntu VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          CONTENT_SYNC_REQUIRED: ${{ steps.content_sync.outputs.required }}
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: CONTENT_SYNC_REQUIRED
          script_stop: true
          script: |
            echo "🚀 Updating Tech Katta Backend on VPS..."
            sudo -u techkatta bash -c 'cd /opt/tech-katta && git fetch origin main && git reset --hard origin/main'

            echo "📦 Installing production dependencies..."
            sudo -u techkatta bash -c 'cd /opt/tech-katta/backend && npm ci --omit=dev'

            echo "⚙️ Enforcing production runtime configuration..."
            sudo mkdir -p /etc/systemd/system/tech-katta-api.service.d
            printf '%s\n' '[Service]' 'Environment=NODE_ENV=production' 'Environment=FRONTEND_ORIGIN=https://tech.katta.cc' | sudo tee /etc/systemd/system/tech-katta-api.service.d/production.conf >/dev/null
            sudo systemctl daemon-reload

            if [ "$CONTENT_SYNC_REQUIRED" = "true" ]; then
              echo "🌱 Content source changed or manual sync requested; syncing article content to MongoDB..."
              sudo -u techkatta bash -c 'cd /opt/tech-katta/backend && npm run seed'
            else
              echo "⏭️ Skipping MongoDB seed: no content source changes detected."
            fi

            echo "🛡️ Installing VPS-first overflow monitor..."
            sudo install -m 0755 /opt/tech-katta/scripts/vps-overflow-router.sh /usr/local/bin/tech-katta-overflow-router
            sudo tee /etc/systemd/system/tech-katta-overflow.service >/dev/null <<'EOF'
            [Unit]
            Description=Tech Katta VPS-first overflow state monitor
            After=network-online.target tech-katta-api.service
            Wants=network-online.target

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/tech-katta-overflow-router
            EOF

            sudo tee /etc/systemd/system/tech-katta-overflow.timer >/dev/null <<'EOF'
            [Unit]
            Description=Run Tech Katta overflow monitor every 30 seconds

            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=30s
            Unit=tech-katta-overflow.service

            [Install]
            WantedBy=timers.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable --now tech-katta-overflow.timer

            echo "🔄 Restarting tech-katta-api service..."
            sudo systemctl restart tech-katta-api

            echo "🩺 Verifying service status and health check..."
            sleep 2
            sudo systemctl is-active --quiet tech-katta-api || (echo "❌ Service is not active!" && exit 1)
            curl -fsS http://127.0.0.1:5000/api/health || (echo "❌ Local health check failed!" && exit 1)
            sudo systemctl is-active --quiet tech-katta-overflow.timer || (echo "❌ Overflow monitor timer is not active!" && exit 1)

            if ! sudo ss -lntp | grep -Fq '127.0.0.1:5000'; then
              echo "❌ API is not listening on the loopback interface!"
              sudo ss -lntp | grep ':5000' || true
              exit 1
            fi

            if sudo ss -lntp | grep -Fq '0.0.0.0:5000'; then
              echo "❌ API is exposed on all IPv4 interfaces!"
              exit 1
            fi

            echo "✅ Deployment successful and locally verified!"

      - name: Run production smoke tests
        run: NODE_TLS_REJECT_UNAUTHORIZED=0 node scripts/production-smoke.mjs
