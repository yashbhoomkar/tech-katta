name: Deploy Tech Katta Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tech-katta-backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check syntax
        run: node --check src/server.js

  deploy:
    name: Deploy and verify VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS and check local endpoint
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            sudo -u techkatta bash -c 'cd /opt/tech-katta && git fetch origin main && git reset --hard origin/main'
            sudo -u techkatta bash -c 'cd /opt/tech-katta/backend && npm ci --omit=dev'
            sudo -n mkdir -p /etc/systemd/system/tech-katta-api.service.d
            printf '%s\n' '[Service]' 'Environment=NODE_ENV=production' 'Environment=HOST=127.0.0.1' 'Environment=PORT=5000' 'Environment=FRONTEND_ORIGIN=https://tech.katta.cc' | sudo -n tee /etc/systemd/system/tech-katta-api.service.d/production.conf >/dev/null
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart tech-katta-api
            for attempt in $(seq 1 15); do
              if curl --fail --silent --show-error http://127.0.0.1:5000/health >/tmp/tech-katta-health.json; then
                cat /tmp/tech-katta-health.json
                exit 0
              fi
              sleep 1
            done
            echo 'Health endpoint failed after service restart.'
            sudo -n systemctl status tech-katta-api --no-pager || true
            sudo -n journalctl -u tech-katta-api -n 80 --no-pager || true
            exit 1

      - name: Verify public API endpoint
        run: |
          set -eu
          for attempt in $(seq 1 10); do
            if curl --fail --silent --show-error https://tech-api.katta.cc/health; then
              echo
              exit 0
            fi
            sleep 3
          done
          echo 'Public health endpoint did not return success.'
          exit 1
