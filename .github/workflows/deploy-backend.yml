name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      sync_content:
        description: 'Explicitly sync article/category data to MongoDB'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tech-katta-backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Test backend before deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Require the production branch
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production deployment must run from main."
            exit 1
          fi
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies
        run: npm ci
      - name: Run backend unit tests
        run: npm test
      - name: Syntax-check backend
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/seed.js
          node --check src/vercelClient.js
          node --check scripts/vercel-control.mjs
          node --check scripts/vercel-mcp.mjs
      - name: Validate VPS overflow monitor
        working-directory: .
        run: bash -n scripts/vps-overflow-router.sh

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tested revision
        run: |
          test "$DEPLOY_SHA" = "$GITHUB_SHA"
          git cat-file -e "$DEPLOY_SHA^{commit}"

      - name: Validate backend JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Syntax-check backend
        working-directory: backend
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/seed.js
          node --check src/vercelClient.js
          node --check scripts/vercel-control.mjs
          node --check scripts/vercel-mcp.mjs

      - name: Validate VPS overflow monitor
        run: bash -n scripts/vps-overflow-router.sh

      - name: Determine whether content sync is required
        id: content_sync
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_SYNC_CONTENT: ${{ inputs.sync_content }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=${MANUAL_SYNC_CONTENT:-false}" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -Eq '^(backend/src/data\.js|backend/src/.*Content\.js|backend/src/distributedSystemsConcepts\.js|backend/src/distributedSystemComponents\.js|backend/src/contentSchema\.js|backend/src/seed\.js)$'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare VPS checkout, dependencies, and runtime config
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DEPLOY_SHA
          script_stop: true
          script: |
            echo "🚀 Preparing Tech Katta Backend on VPS for $DEPLOY_SHA..."
            sudo -u techkatta bash -c 'set -euo pipefail; cd /opt/tech-katta; git fetch origin main; git reset --hard "$1"; test "$(git rev-parse HEAD)" = "$1"' deploy "$DEPLOY_SHA"

            echo "📦 Installing production dependencies..."
            sudo -u techkatta bash -c 'cd /opt/tech-katta/backend && npm ci --omit=dev'

            echo "⚙️ Enforcing production runtime configuration..."
            sudo -n true || (echo "❌ Deployment user cannot run sudo non-interactively as root." && exit 1)
            sudo -n mkdir -p /etc/systemd/system/tech-katta-api.service.d || (echo "❌ Failed to create the API systemd drop-in directory." && exit 1)
            printf '%s\n' '[Service]' 'Environment=NODE_ENV=production' 'Environment=FRONTEND_ORIGIN=https://tech.katta.cc' | sudo -n tee /etc/systemd/system/tech-katta-api.service.d/production.conf >/dev/null || (echo "❌ Failed to write the API production environment drop-in." && exit 1)
            sudo -n systemctl daemon-reload || (echo "❌ systemd daemon-reload failed." && sudo -n systemctl --failed --no-pager || true; exit 1)
            echo "✅ Runtime configuration installed."

      - name: Sync MongoDB content when required
        if: steps.content_sync.outputs.required == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DEPLOY_SHA
          script_stop: true
          script: |
            echo "🌱 Syncing content from tested revision $DEPLOY_SHA..."
            sudo -u techkatta bash -c 'set -euo pipefail; cd /opt/tech-katta; test "$(git rev-parse HEAD)" = "$1"; cd backend; npm run seed' deploy "$DEPLOY_SHA"

      - name: Restart and verify Tech Katta API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: DEPLOY_SHA
          script_stop: true
          script: |
            sudo -u techkatta bash -c 'cd /opt/tech-katta && test "$(git rev-parse HEAD)" = "$1"' deploy "$DEPLOY_SHA"
            echo "🛑 Disabling the placeholder overflow monitor until routing is implemented..."
            # The monitor only writes a state file; Nginx does not consume it and no
            # production secondary is configured. Do not schedule a no-op every 30s.
            sudo systemctl disable --now tech-katta-overflow.timer 2>/dev/null || true
            sudo systemctl stop tech-katta-overflow.service 2>/dev/null || true
            echo "ℹ️ Overflow routing remains disabled until a compatible secondary and proxy integration are verified."

            echo "🔄 Restarting tech-katta-api service..."
            sudo systemctl restart tech-katta-api

            echo "🩺 Verifying service status and health check..."
            sleep 2
            sudo systemctl is-active --quiet tech-katta-api || (echo "❌ Service is not active!" && exit 1)
            curl -fsS http://127.0.0.1:5000/api/health || (echo "❌ Local health check failed!" && exit 1)
            if sudo systemctl is-active --quiet tech-katta-overflow.timer; then
              echo "❌ Placeholder overflow timer is still active!"
              exit 1
            fi

            if ! sudo ss -lntp | grep -Fq '127.0.0.1:5000'; then
              echo "❌ API is not listening on the loopback interface!"
              sudo ss -lntp | grep ':5000' || true
              exit 1
            fi

            if sudo ss -lntp | grep -Fq '0.0.0.0:5000'; then
              echo "❌ API is exposed on all IPv4 interfaces!"
              exit 1
            fi

            echo "✅ Deployment successful and locally verified!"

      - name: Run production smoke tests
        run: node scripts/production-smoke.mjs
