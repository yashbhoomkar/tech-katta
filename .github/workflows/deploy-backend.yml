name: Deploy Tech Katta Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'content/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      moving:
        description: 'Moving servers: the new server is not behind tech-api.katta.cc yet, so skip the public check (then run "Point API at the server")'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tech-katta-backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check syntax
        run: node --check src/server.js
      - name: Validate content
        run: node scripts/check-content.mjs ../content

  deploy:
    name: Deploy and verify VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Deploys exactly the commit the test job checked (github.sha), not whatever main is now.
      # The new release is live only when /health reports it; if the service does not come back,
      # the previous code and content release are restored and the job fails.
      # The server keeps nothing that exists only on it: every API setting lives in GitHub (secrets for private
      # values, variables for the rest) and this step builds the server's whole settings file from them on every
      # deploy, so a new server gets exactly the same settings and nothing is ever typed onto a server by hand.
      # Add a setting by adding its name to OPTIONAL_SECRETS / OPTIONAL_VARS below (and to `env:`).
      # Values travel base64-encoded, so characters such as & ? = % in the MongoDB URI survive the shell on the
      # way; the encoded values are masked in the log too.
      - name: Prepare API settings
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ORIGIN_CERT: ${{ secrets.ORIGIN_CERT }}
          ORIGIN_KEY: ${{ secrets.ORIGIN_KEY }}
          # optional, private (secrets)
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          # optional, not private (variables); unset = the API's default (backend/.env.example)
          AI_ENABLED: ${{ vars.AI_ENABLED }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_JSON_MODE: ${{ vars.AI_JSON_MODE }}
          AI_TOKENS_PARAM: ${{ vars.AI_TOKENS_PARAM }}
          AI_EXTRA_BODY: ${{ vars.AI_EXTRA_BODY }}
          AI_TIMEOUT_MS: ${{ vars.AI_TIMEOUT_MS }}
          AI_MAX_OUTPUT_TOKENS: ${{ vars.AI_MAX_OUTPUT_TOKENS }}
          AI_MONTHLY_REVIEWS: ${{ vars.AI_MONTHLY_REVIEWS }}
          AI_DAILY_REVIEWS: ${{ vars.AI_DAILY_REVIEWS }}
          AI_DAILY_TOKEN_CAP: ${{ vars.AI_DAILY_TOKEN_CAP }}
          AI_ALLOW: ${{ vars.AI_ALLOW }}
          JUDGE_WORKERS: ${{ vars.JUDGE_WORKERS }}
          REQUIRED: GOOGLE_CLIENT_ID MONGODB_URI SESSION_SECRET
          OPTIONAL_SECRETS: AI_API_KEY ADMIN_EMAILS
          OPTIONAL_VARS: AI_ENABLED AI_PROVIDER AI_MODEL AI_BASE_URL AI_JSON_MODE AI_TOKENS_PARAM AI_EXTRA_BODY AI_TIMEOUT_MS AI_MAX_OUTPUT_TOKENS AI_MONTHLY_REVIEWS AI_DAILY_REVIEWS AI_DAILY_TOKEN_CAP AI_ALLOW JUDGE_WORKERS
        run: |
          set -eu
          for name in ORIGIN_CERT ORIGIN_KEY; do
            value=$(printenv "$name" || true)
            if [ -n "$value" ]; then encoded=$(printf %s "$value" | base64 -w0); echo "::add-mask::$encoded"; else encoded=''; fi
            echo "${name}_B64=$encoded" >> "$GITHUB_ENV"
          done
          # The whole settings file (systemd EnvironmentFile lines NAME="value"), from GitHub only.
          node -e '
            const names = (k) => (process.env[k] || "").split(/\s+/).filter(Boolean);
            const missing = names("REQUIRED").filter((n) => !process.env[n]);
            if (missing.length) { console.log("::error::Missing GitHub secrets: " + missing.join(", ") + ". The server gets its settings only from GitHub (ops/README.md)."); process.exit(1); }
            const lines = [], set = [];
            for (const n of [...names("REQUIRED"), ...names("OPTIONAL_SECRETS"), ...names("OPTIONAL_VARS")]) {
              const v = process.env[n];
              if (!v) continue;
              if (/[\r\n]/.test(v)) { console.log("::error::Setting " + n + " has a line break; settings are one line each."); process.exit(1); }
              lines.push(n + "=\"" + v.replace(/[\\"$]/g, "\\$&") + "\"");
              set.push(n);
            }
            const b64 = Buffer.from(lines.join("\n") + "\n").toString("base64");
            console.log("::add-mask::" + b64);
            require("fs").appendFileSync(process.env.GITHUB_ENV, "API_ENV_B64=" + b64 + "\n");
            console.log("API settings from GitHub (names only): " + set.join(" "));'
          # Shape of MONGODB_URI as yes/no facts only (never the value), so a bad secret is easy to spot.
          node -e '
            const u = process.env.MONGODB_URI || ""; const yn = (b) => (b ? "yes" : "NO");
            const m = /^mongodb(\+srv)?:\/\/([^:@\/]*)(?::([^@]*))?@([^\/?]+)/.exec(u);
            const user = m ? decodeURIComponent(m[2]) : "";
            console.log("MONGODB_URI check:", [
              "set " + yn(u.length > 0),
              "starts with mongodb+srv:// " + yn(u.startsWith("mongodb+srv://")),
              "user techkatta-api " + yn(user === "techkatta-api"),
              "has a password " + yn(!!(m && m[3])),
              "host is Cluster0 " + yn(!!m && /^cluster0\.[a-z0-9]+\.mongodb\.net$/.test(m[4])),
              "no < > " + yn(!/[<>]/.test(u)),
              "no spaces or quotes " + yn(!/[\s"\x27]/.test(u)),
              "password URL-safe " + yn(!m || !m[3] || !/[@:\/?#\[\]]/.test(m[3])),
            ].join(" | "));'
      - name: Deploy to VPS and check local endpoint
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          envs: API_ENV_B64,ORIGIN_CERT_B64,ORIGIN_KEY_B64
          # The server: repository variables VPS_HOST, VPS_USER, VPS_FINGERPRINT (Settings → Secrets and variables →
          # Actions → Variables; secrets of the same names also work). Changing servers = changing these (ops/README.md).
          # The fallbacks are the old Bluehost server; remove them once the variables are set.
          host: ${{ vars.VPS_HOST || secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ vars.VPS_USER || secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ vars.VPS_FINGERPRINT || secrets.VPS_FINGERPRINT }}
          port: 22
          script_stop: false # the script sets -eu itself and rolls back on any failure
          script: |
            set -eu
            SHA='${{ github.sha }}'
            APP=/opt/tech-katta
            BASE=/var/lib/tech-katta/content
            app() { sudo -u techkatta "$@"; }
            # point the "current" symlink at a release in one atomic rename
            point() { app ln -sfn "$1" "$BASE/current.next" && app mv -Tf "$BASE/current.next" "$BASE/current"; }
            # healthy <release name>: the API answers and serves that release
            healthy() { for attempt in $(seq 1 20); do
                if curl --fail --silent --show-error http://127.0.0.1:5000/health >/tmp/tech-katta-health.json 2>/dev/null && grep -q "\"release\":\"$1\"" /tmp/tech-katta-health.json; then cat /tmp/tech-katta-health.json; echo; return 0; fi
                sleep 1; done; return 1; }

            sudo -n mkdir -p "$BASE/releases"
            sudo -n chown -R techkatta:techkatta /var/lib/tech-katta
            PREV_SHA=$(app git -C "$APP" rev-parse HEAD)
            PREV_REL=$(app readlink "$BASE/current" || true)
            echo "previous: code $PREV_SHA, content ${PREV_REL:-none}"

            # From the moment the checkout changes, any failure (npm ci, validation, symlink,
            # restart, health) ends here: put back the previous code and content, restart, fail.
            STARTED=0; DEPLOYED=0
            rollback() {
              rc=$?
              if [ "$DEPLOYED" = 1 ] || [ "$STARTED" = 0 ]; then exit "$rc"; fi
              set +e
              echo "Deploy of $SHA failed. Rolling back to $PREV_SHA."
              sudo -n systemctl status tech-katta-api --no-pager
              sudo -n journalctl -u tech-katta-api -n 80 --no-pager
              app git -C "$APP" reset --hard "$PREV_SHA"
              app bash -c "cd $APP/backend && npm ci --omit=dev"
              if [ -n "$PREV_REL" ]; then point "$PREV_REL"; fi
              sudo -n systemctl restart tech-katta-api
              if healthy "$(basename "${PREV_REL:-none}")"; then echo "Rolled back to $PREV_SHA and ${PREV_REL}."; else echo 'Rollback did not come back healthy either. Check the VPS.'; fi
              exit 1
            }
            trap rollback EXIT

            app git -C "$APP" fetch --quiet origin main
            app git -C "$APP" merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main; refusing to deploy."; exit 1; }
            STARTED=1
            app git -C "$APP" reset --hard "$SHA"
            app bash -c "cd $APP/backend && npm ci --omit=dev"

            # Content is stored on the VPS disk as dated releases; the API serves "current".
            # A release is validated before "current" moves to it, so bad content never goes live.
            NAME="$(date -u +%Y%m%dT%H%M%SZ)-$(printf %.7s "$SHA")"
            REL="$BASE/releases/$NAME"
            app mkdir -p "$REL"
            app cp -a "$APP/content/." "$REL/"
            app node "$APP/backend/scripts/check-content.mjs" "$REL"
            point "$REL"

            # API settings: the whole root-only file is replaced from GitHub on every deploy (built in "Prepare API
            # settings"), so nothing set by hand on a server survives or is needed. Names that were on the server but
            # are not in GitHub are listed (names only) so a forgotten setting is visible. Values never reach the log.
            ENVDIR=/etc/tech-katta
            sudo -n mkdir -p "$ENVDIR"
            printf %s "$API_ENV_B64" | base64 -d > /tmp/tk-api.env; chmod 600 /tmp/tk-api.env
            DROPPED=$(sudo -n sh -c "test -f '$ENVDIR/api.env' && sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' '$ENVDIR/api.env'" | while read -r n; do grep -q "^$n=" /tmp/tk-api.env || printf '%s ' "$n"; done || true)
            [ -z "$DROPPED" ] || echo "Settings removed from the server (not in GitHub; add them there to keep them): $DROPPED"
            sudo -n sh -c "umask 077; cat /tmp/tk-api.env > '$ENVDIR/api.env.next' && mv -f '$ENVDIR/api.env.next' '$ENVDIR/api.env'"
            rm -f /tmp/tk-api.env
            echo 'API settings written from GitHub.'

            # TLS for servers set up by ops/provision-vps.sh (they have /etc/tech-katta/tls): the Cloudflare Origin
            # certificate from the ORIGIN_CERT / ORIGIN_KEY secrets, so no server needs it pasted by hand. Written only
            # when it differs; Nginx is checked before it reloads, and a bad pair is put back.
            TLS=/etc/tech-katta/tls
            if [ -n "${ORIGIN_CERT_B64:-}" ] && [ -n "${ORIGIN_KEY_B64:-}" ] && sudo -n test -d "$TLS"; then
              printf %s "$ORIGIN_CERT_B64" | base64 -d > /tmp/tk-origin.pem
              printf %s "$ORIGIN_KEY_B64" | base64 -d > /tmp/tk-origin.key; chmod 600 /tmp/tk-origin.key
              if ! sudo -n cmp -s /tmp/tk-origin.pem "$TLS/origin.pem" || ! sudo -n cmp -s /tmp/tk-origin.key "$TLS/origin.key"; then
                sudo -n cp -a "$TLS/origin.pem" "$TLS/origin.pem.prev"; sudo -n cp -a "$TLS/origin.key" "$TLS/origin.key.prev"
                sudo -n install -m 644 /tmp/tk-origin.pem "$TLS/origin.pem"; sudo -n install -m 600 /tmp/tk-origin.key "$TLS/origin.key"
                if sudo -n nginx -t -q; then sudo -n systemctl reload nginx; echo 'Origin certificate installed.'
                else sudo -n mv -f "$TLS/origin.pem.prev" "$TLS/origin.pem"; sudo -n mv -f "$TLS/origin.key.prev" "$TLS/origin.key"; echo 'Origin certificate rejected by Nginx; kept the previous one.'; fi
              else echo 'Origin certificate unchanged.'; fi
              rm -f /tmp/tk-origin.pem /tmp/tk-origin.key
            fi

            sudo -n mkdir -p /etc/systemd/system/tech-katta-api.service.d
            printf '%s\n' '[Service]' 'Restart=always' 'RestartSec=2' 'Environment=NODE_ENV=production' 'Environment=HOST=127.0.0.1' 'Environment=PORT=5000' 'Environment=FRONTEND_ORIGIN=https://tech.katta.cc' "Environment=CONTENT_DIR=$BASE/current" "EnvironmentFile=-$ENVDIR/api.env" | sudo -n tee /etc/systemd/system/tech-katta-api.service.d/production.conf >/dev/null
            sudo -n systemctl daemon-reload
            sudo -n systemctl restart tech-katta-api
            healthy "$NAME" || { echo "API did not come back serving $NAME."; exit 1; }
            DEPLOYED=1

            # keep the 10 newest releases; names start with a UTC timestamp, so sort by name
            # (cp -a keeps the old mtime of the source folder, so time order is wrong)
            app bash -c "ls -1d $BASE/releases/*/ | sort -r | tail -n +11 | xargs -r rm -rf --" || echo 'Pruning old releases failed (deploy is fine).'
            echo "deployed $SHA, content current -> $REL"

      - name: Verify public API endpoint
        if: ${{ !inputs.moving }}
        run: |
          set -eu
          for _ in $(seq 1 10); do
            if curl --fail --silent --show-error https://tech-api.katta.cc/health >/tmp/health.json; then
              cat /tmp/health.json; echo
              # The public API must serve the release this run just deployed.
              grep -q "\"release\":\"20[0-9TZ]*-${GITHUB_SHA:0:7}\"" /tmp/health.json || { echo "API is not serving the release for ${GITHUB_SHA:0:7} yet."; sleep 3; continue; }
              for path in /v1/site /v1/articles /v1/lab /v1/auth/config; do curl --fail --silent --show-error -o /dev/null "https://tech-api.katta.cc$path"; done
              echo 'Content endpoints OK.'
              exit 0
            fi
            sleep 3
          done
          echo 'Public API did not serve the new release.'
          exit 1
