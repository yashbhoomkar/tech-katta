name: Frontend

# Every PR and push to main that touches the frontend runs the Lab engine tests and the
# production build, so a broken build is caught before Vercel ever sees it. Content changes run it too:
# the judge's calibration test checks every problem's tests against its reference and wrong designs.
on:
  pull_request:
    paths: ['frontend/**', 'content/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'content/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  build:
    name: Test and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lab engine tests
        run: npm test
      - name: Production build
        run: npm run build
