name: Backend

# The backend's tests on every PR, before merge. deploy-backend.yml runs the same tests after merge
# and refuses to deploy if they fail, but by then main already holds the broken change. The backend
# also imports the Lab, store and judge code from frontend/src, so those paths count too.
on:
  pull_request:
    paths: ['backend/**', 'content/**', 'frontend/src/lab/**', 'frontend/src/judge/**', 'frontend/src/figs/**', '.github/workflows/backend.yml']

permissions:
  contents: read

jobs:
  test:
    name: Test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check syntax
        run: node --check src/server.js
      - name: Check content
        run: node scripts/check-content.mjs ../content
