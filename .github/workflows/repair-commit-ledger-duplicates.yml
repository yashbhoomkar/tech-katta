name: Repair Commit Ledger Duplicates

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-commit-ledger-duplicates.yml"
      - ".github/maintenance/repair-commit-ledger-duplicates.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-commit-ledger-duplicates
  cancel-in-progress: false

jobs:
  repair:
    name: Validate and repair duplicate commit ledger rows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check migration and pass it to the VPS
        shell: bash
        run: |
          node --check .github/maintenance/repair-commit-ledger-duplicates.mjs
          printf 'LEDGER_REPAIR_SCRIPT_B64=' >> "$GITHUB_ENV"
          base64 -w0 .github/maintenance/repair-commit-ledger-duplicates.mjs >> "$GITHUB_ENV"
          printf '\n' >> "$GITHUB_ENV"

      - name: Run guarded migration through the VPS runtime credentials
        uses: appleboy/ssh-action@v1.2.0
        env:
          LEDGER_REPAIR_SCRIPT_B64: ${{ env.LEDGER_REPAIR_SCRIPT_B64 }}
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          envs: LEDGER_REPAIR_SCRIPT_B64
          script: |
            set -eu
            REPAIR_SCRIPT="/opt/tech-katta/backend/.ledger-repair-$$.mjs"
            trap 'sudo -n -u techkatta rm -f "$REPAIR_SCRIPT" || true' EXIT
            printf '%s' "$LEDGER_REPAIR_SCRIPT_B64" | base64 -d | sudo -n -u techkatta tee "$REPAIR_SCRIPT" >/dev/null
            sudo -n -u techkatta bash -lc "cd /opt/tech-katta/backend && node '$REPAIR_SCRIPT'"
