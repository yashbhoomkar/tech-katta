name: Verify Ledger Maintenance Access

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-ledger-maintenance-access.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-ledger-maintenance-access
  cancel-in-progress: false

jobs:
  verify:
    name: Verify MongoDB unique-index capability through VPS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify isolated unique-index probe using the VPS runtime credentials
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            PROBE_SCRIPT="/opt/tech-katta/backend/.ledger-index-probe-${{ github.run_id }}.mjs"
            trap 'sudo -n -u techkatta rm -f "$PROBE_SCRIPT" || true' EXIT
            printf '%s' '' | base64 -d | sudo -n -u techkatta tee "$PROBE_SCRIPT" >/dev/null
            sudo -n -u techkatta bash -lc "cd /opt/tech-katta/backend && PROBE_RUN_ID='${{ github.run_id }}' node '$PROBE_SCRIPT'"
