name: Rotate MongoDB Runtime Credential

on:
  workflow_dispatch:
    inputs:
      confirm_rotation:
        description: "Confirm that the rotated, least-privilege URI is stored in TECH_KATTA_MONGODB_URI_ROTATED"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rotate-mongodb-runtime-credential
  cancel-in-progress: false

jobs:
  rotate:
    if: ${{ inputs.confirm_rotation }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate rotation helper syntax
        run: node --check .github/scripts/rotate-mongodb-runtime-uri.mjs

      - name: Require the rotated URI secret without printing it
        shell: bash
        env:
          ROTATED_URI: ${{ secrets.TECH_KATTA_MONGODB_URI_ROTATED }}
        run: |
          set -euo pipefail
          if [[ -z "$ROTATED_URI" ]]; then
            echo "::error::Add repository secret TECH_KATTA_MONGODB_URI_ROTATED after rotating/creating the least-privilege Atlas user, then rerun with confirmation enabled."
            exit 1
          fi
          if [[ ! "$ROTATED_URI" =~ ^mongodb(\+srv)?:// ]] || [[ "$ROTATED_URI" == *$'\n'* ]] || [[ "$ROTATED_URI" == *$'\r'* ]]; then
            echo "::error::The rotated URI has an invalid format. Secret value was not printed."
            exit 1
          fi
          echo "Rotated URI secret is present and has an acceptable URI format; value suppressed."

      - name: Apply rotated URI and verify API with automatic rollback
        uses: appleboy/ssh-action@v1.2.0
        env:
          MONGODB_URI: ${{ secrets.TECH_KATTA_MONGODB_URI_ROTATED }}
          ROTATION_ID: ${{ github.run_id }}
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: MONGODB_URI,ROTATION_ID
          script_stop: true
          script: |
            set -eu
            ENV_FILE="/opt/tech-katta/backend/.env"
            BACKUP="${ENV_FILE}.rotation-backup-${ROTATION_ID}"

            rollback_on_failure() {
              rc=$?
              if [ "$rc" -ne 0 ] && sudo -n test -f "$BACKUP"; then
                echo "Rotation validation failed; restoring the previous runtime env."
                if sudo -n -u techkatta cp "$BACKUP" "$ENV_FILE" && sudo -n systemctl restart tech-katta-api; then
                  sudo -n -u techkatta rm -f "$BACKUP"
                  echo "Rollback completed; previous service configuration restored."
                else
                  echo "ROLLBACK FAILURE: backup retained at $BACKUP; manual recovery is required."
                fi
              fi
              return "$rc"
            }
            trap rollback_on_failure EXIT

            if [ -z "$MONGODB_URI" ]; then
              echo "Rotated URI secret is missing; no remote changes made."
              exit 1
            fi

            # The repository checkout is the source for the reviewed, non-secret helper.
            sudo -n -u techkatta bash -lc 'cd /opt/tech-katta && git fetch origin main && git reset --hard origin/main'
            sudo -n -u techkatta --preserve-env=MONGODB_URI,ROTATION_ID bash -lc 'cd /opt/tech-katta && node .github/scripts/rotate-mongodb-runtime-uri.mjs'

            sudo -n systemctl restart tech-katta-api

            healthy=0
            for attempt in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:5000/api/health/ready >/dev/null &&
                 curl -fsS http://127.0.0.1:5000/api/categories >/dev/null &&
                 curl -fsS http://127.0.0.1:5000/api/articles >/dev/null; then
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Post-rotation readiness/API smoke failed; triggering rollback."
              exit 1
            fi

            sudo -n -u techkatta rm -f "$BACKUP"
            trap - EXIT
            echo "Credential rotation verified: readiness, categories, and articles passed; temporary backup removed. URI value was never printed."
