name: Repair Tech Katta API TLS Certificate

on:
  push:
    branches:
      - ops/repair-api-tls-certificate
    paths:
      - '.github/workflows/repair-api-tls.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Issue trusted certificate with preflight, backup, and verification
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            DOMAIN=tech-api.katta.cc

            echo "=== Preflight: current Nginx config ==="
            sudo -n nginx -t
            sudo -n certbot --version
            sudo -n certbot plugins | grep -i nginx

            echo "=== Preflight: dry-run Let's Encrypt HTTP-01 issuance ==="
            sudo -n certbot certonly --nginx --dry-run --non-interactive --agree-tos --register-unsafely-without-email -d "$DOMAIN"

            echo "=== Backup current Nginx configuration ==="
            BACKUP="/root/nginx-pre-tech-api-cert-$(date -u +%Y%m%dT%H%M%SZ).tar.gz"
            sudo -n tar -czf "$BACKUP" /etc/nginx
            echo "Nginx config backup created: $BACKUP"

            echo "=== Obtain trusted certificate and configure Nginx ==="
            sudo -n certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d "$DOMAIN" --redirect

            echo "=== Validate and reload Nginx ==="
            sudo -n nginx -t
            sudo -n systemctl reload nginx

            echo "=== Verify certificate metadata ==="
            sudo -n openssl x509 -in "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" -noout -subject -issuer -dates -ext subjectAltName

            echo "=== Verify trusted TLS handshake from VPS ==="
            echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" -verify_return_error 2>&1 | tail -n 18

            echo "=== Verify health endpoint with standard TLS validation ==="
            curl -fsS --max-time 15 "https://$DOMAIN/api/health"
