name: Read-only API TLS and Nginx Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-api-tls.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    name: Inspect API TLS certificate on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only VPS diagnostics
        id: tls
        uses: appleboy/ssh-action@v1.2.0
        with:
          capture_stdout: true
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            echo '=== Nginx service ==='
            sudo systemctl is-active nginx
            echo '=== API virtual-host certificate directives ==='
            sudo nginx -T 2>/dev/null | grep -n -B 5 -A 12 'server_name tech-api.katta.cc' || true
            echo '=== Configured certificate metadata (paths, issuer, subject, dates, SAN only) ==='
            sudo nginx -T 2>/dev/null | awk '/ssl_certificate[[:space:]]/ && $1 !~ /_key/ {gsub(";", "", $2); print $2}' | sort -u | while read -r cert; do
              if sudo test -r "$cert"; then
                echo "CERT_PATH=$cert"
                sudo openssl x509 -in "$cert" -noout -subject -issuer -dates -ext subjectAltName || true
              fi
            done
            echo '=== Certbot certificate inventory ==='
            sudo certbot certificates 2>&1 || true
            echo '=== Local Nginx API response ==='
            curl -sS -o /dev/null -w 'LOCAL_HTTP_STATUS=%{http_code}\n' --max-time 5 -H 'Host: tech-api.katta.cc' http://127.0.0.1/api/health || true
            echo '=== VPS public DNS view ==='
            getent ahosts tech-api.katta.cc || true

      - name: Publish sanitized diagnostic output to the verification PR
        if: always()
        uses: actions/github-script@v7
        env:
          DIAGNOSTICS: ${{ steps.tls.outputs.stdout }}
        with:
          script: |
            const output = process.env.DIAGNOSTICS || '(SSH action did not expose captured stdout; inspect the workflow run.)';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 14,
              body: '### Read-only API TLS diagnostics\n\n```text\n' + output.slice(0, 12000) + '\n```'
            });
