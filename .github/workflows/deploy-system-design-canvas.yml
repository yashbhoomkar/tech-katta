name: Deploy System Design Canvas to VPS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-system-design-canvas.yml"

permissions:
  contents: read

concurrency:
  group: demo-system-design-vps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build upstream open-source canvas as static files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ozers/system-design-canvas.git canvas
          cd canvas
          npm ci
          npm run build
          test -s out/index.html

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: system-design-canvas-static
          path: canvas/out/
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: system-design-canvas-static
          path: out/

      - name: Prepare VPS and HTTP virtual host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -eu
            sudo -n true
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx rsync certbot python3-certbot-nginx
            if command -v ufw >/dev/null 2>&1; then
              if sudo ufw status | grep -q '^Status: active'; then
                sudo ufw allow 80/tcp
                sudo ufw allow 443/tcp
              fi
              sudo ufw status verbose
            else
              echo "UFW is not installed; check the VPS provider firewall for inbound TCP 80 and 443."
            fi
            sudo install -d -o www-data -g www-data -m 0755 /var/www/demo-system-design
            printf '%s' 'c2VydmVyIHsKICAgIGxpc3RlbiA4MDsKICAgIGxpc3RlbiBbOjpdOjgwOwogICAgc2VydmVyX25hbWUgZGVtby1zeXN0ZW0tZGVzaWduLmthdHRhLmNjOwogICAgcm9vdCAvdmFyL3d3dy9kZW1vLXN5c3RlbS1kZXNpZ247CiAgICBpbmRleCBpbmRleC5odG1sOwogICAgbG9jYXRpb24gLyB7CiAgICAgICAgdHJ5X2ZpbGVzICR1cmkgJHVyaS8gL2luZGV4Lmh0bWw7CiAgICB9Cn0K' | base64 -d | sudo tee /etc/nginx/sites-available/demo-system-design.katta.cc >/dev/null
            sudo ln -sfn /etc/nginx/sites-available/demo-system-design.katta.cc /etc/nginx/sites-enabled/demo-system-design.katta.cc
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Copy static files to staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "out/**"
          target: "/home/${{ secrets.VPS_USER || 'yash' }}/demo-system-design-staging/"
          strip_components: 1
          overwrite: true

      - name: Install static files and smoke-test origin over HTTP
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script_stop: true
          script: |
            set -eu
            sudo rsync -a --delete "/home/${{ secrets.VPS_USER || 'yash' }}/demo-system-design-staging/" /var/www/demo-system-design/
            sudo chown -R www-data:www-data /var/www/demo-system-design
            sudo nginx -t
            sudo systemctl reload nginx
            test -s /var/www/demo-system-design/index.html
            curl -fsS -H 'Host: demo-system-design.katta.cc' http://127.0.0.1/ -o /dev/null
            echo "VPS_STATIC_SITE_HTTP_READY"

      - name: Issue Let's Encrypt certificate and enable HTTPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -eu
            domain=demo-system-design.katta.cc
            attempt=0
            until getent ahostsv4 "$domain" | grep -q '129.121.133.47'; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 36 ]; then
                echo "DNS has not propagated to VPS IP; refusing to request certificate."
                getent ahostsv4 "$domain" || true
                exit 1
              fi
              sleep 5
            done
            sudo certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email --redirect -d "$domain"
            sudo nginx -t
            sudo systemctl reload nginx
            curl -fsS "https://$domain/" -o /dev/null
            echo "VPS_STATIC_SITE_HTTPS_READY"
