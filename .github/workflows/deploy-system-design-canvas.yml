name: Deploy System Design Canvas to VPS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-system-design-canvas.yml"

permissions:
  contents: read

concurrency:
  group: demo-system-design-vps
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build upstream open-source canvas as static files
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ozers/system-design-canvas.git canvas
          cd canvas
          npm ci
          npm run build
          test -s out/index.html

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: system-design-canvas-static
          path: canvas/out/
          if-no-files-found: error
          retention-days: 2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: system-design-canvas-static
          path: out/

      - name: Prepare VPS and HTTP virtual host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -eu
            sudo -n true
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx rsync
            sudo install -d -o www-data -g www-data -m 0755 /var/www/demo-system-design
            printf '%s\\n' 'server {' '    listen 80;' '    listen [::]:80;' '    server_name demo-system-design.katta.cc;' '    root /var/www/demo-system-design;' '    index index.html;' '    location / {' '        try_files $uri $uri/ /index.html;' '    }' '    location ~* \\.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {' '        expires 7d;' '        add_header Cache-Control "public";' '        try_files $uri =404;' '    }' '}' | sudo tee /etc/nginx/sites-available/demo-system-design.katta.cc >/dev/null
            sudo ln -sfn /etc/nginx/sites-available/demo-system-design.katta.cc /etc/nginx/sites-enabled/demo-system-design.katta.cc
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Copy static files to staging directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "out/**"
          target: "/home/${{ secrets.VPS_USER || 'yash' }}/demo-system-design-staging/"
          strip_components: 1
          overwrite: true

      - name: Install static files and smoke-test origin over HTTP
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script_stop: true
          script: |
            set -eu
            sudo rsync -a --delete "/home/${{ secrets.VPS_USER || 'yash' }}/demo-system-design-staging/" /var/www/demo-system-design/
            sudo chown -R www-data:www-data /var/www/demo-system-design
            sudo nginx -t
            sudo systemctl reload nginx
            test -s /var/www/demo-system-design/index.html
            curl -fsS -H 'Host: demo-system-design.katta.cc' http://127.0.0.1/ -o /dev/null
            echo "VPS_STATIC_SITE_HTTP_READY"
