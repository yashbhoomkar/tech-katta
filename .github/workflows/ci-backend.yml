name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/scripts/**"
      - ".github/workflows/rotate-mongodb-runtime-credential.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/scripts/**"
      - ".github/workflows/rotate-mongodb-runtime-credential.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test backend (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax-check guarded MongoDB rotation helper
        run: node --check ../.github/scripts/rotate-mongodb-runtime-uri.mjs
      - name: Run backend tests
        run: npm test
