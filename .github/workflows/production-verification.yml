name: Production Browser and Bounded Load Verification

on:
  push:
    branches:
      - test/production-browser-load-verification
    paths:
      - 'scripts/production-browser-smoke.mjs'
      - 'scripts/production-load-smoke.mjs'
      - '.github/workflows/production-verification.yml'
  pull_request:
    paths:
      - 'scripts/production-browser-smoke.mjs'
      - 'scripts/production-load-smoke.mjs'
      - '.github/workflows/production-verification.yml'
  workflow_dispatch:
    inputs:
      run_load_test:
        description: 'Run the bounded GET-only production load probe (maximum 60 requests, concurrency 3)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Real Chromium browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright dependency
        run: |
          npm install --prefix /tmp/tech-katta-playwright playwright
          /tmp/tech-katta-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Repair invalid public API certificate for this dedicated verification branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'test/production-browser-load-verification'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            echo '=== Check Certbot availability ==='
            sudo certbot --version
            echo '=== Validate HTTP-01 challenge path using a dry run ==='
            sudo certbot certonly --nginx --dry-run --non-interactive --agree-tos --register-unsafely-without-email -d tech-api.katta.cc
            echo '=== Obtain and configure a publicly trusted certificate ==='
            sudo certbot --nginx --non-interactive --agree-tos --register-unsafely-without-email -d tech-api.katta.cc --redirect
            echo '=== Validate and reload Nginx ==='
            sudo nginx -t
            sudo systemctl reload nginx
            echo '=== Verify public certificate chain from the VPS ==='
            echo | openssl s_client -connect tech-api.katta.cc:443 -servername tech-api.katta.cc -verify_return_error 2>&1 | tail -n 18
      - name: Diagnose public API TLS certificate chain
        run: |
          echo | openssl s_client -connect tech-api.katta.cc:443 -servername tech-api.katta.cc -verify_return_error 2>&1 | tail -n 35 || true
          curl -sS -o /dev/null -w 'API_TLS_HTTP_STATUS=%{http_code}\n' --max-time 15 https://tech-api.katta.cc/api/health || true
      - name: Test production SPA routes and browser-origin API access
        env:
          PLAYWRIGHT_MODULE: /tmp/tech-katta-playwright/node_modules/playwright/index.mjs
          FRONTEND_URL: https://tech.katta.cc
          API_URL: https://tech-api.katta.cc
        run: node scripts/production-browser-smoke.mjs

  bounded-load-smoke:
    name: Bounded production GET load probe
    needs: browser-smoke
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_load_test == true)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bounded GET-only probe
        env:
          API_URL: https://tech-api.katta.cc
          LOAD_CONCURRENCY: '3'
          LOAD_MAX_REQUESTS: '60'
        run: node scripts/production-load-smoke.mjs
