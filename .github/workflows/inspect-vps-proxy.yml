name: Inspect VPS Proxy Security

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-vps-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-vps-proxy
  cancel-in-progress: true

jobs:
  inspect:
    name: Read-only VPS proxy diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report whether public DNS uses Cloudflare proxy
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress
          import json
          import socket
          import urllib.request

          host = "tech-api.katta.cc"
          addresses = sorted({
              ipaddress.ip_address(item[4][0])
              for item in socket.getaddrinfo(host, None)
          })
          if not addresses:
              raise SystemExit(f"No DNS addresses found for {host}")

          print(f"DNS addresses for {host}:")
          for address in addresses:
              print(f"- {address}")

          request = urllib.request.Request(
              "https://api.cloudflare.com/client/v4/ips",
              headers={"User-Agent": "Tech-Katta-Operations-Check/1.0"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              payload = json.load(response)
          if not payload.get("success"):
              raise SystemExit("Cloudflare API did not return a successful IP-range response.")

          result = payload["result"]
          networks = [
              ipaddress.ip_network(cidr)
              for cidr in result.get("ipv4_cidrs", []) + result.get("ipv6_cidrs", [])
          ]
          if not networks:
              raise SystemExit("Cloudflare API returned no IP ranges.")

          outside = []
          for address in addresses:
              proxied = any(address in network for network in networks)
              print(f"- {address} (Cloudflare edge: {proxied})")
              if not proxied:
                  outside.append(address)

          if outside:
              print("::warning::Public DNS includes addresses outside Cloudflare proxy ranges; do not restrict the origin firewall to Cloudflare yet.")
              else:
                  print("All public DNS addresses belong to Cloudflare official proxy ranges.")
          PY

      - name: Inspect proxy and firewall configuration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            echo "=== Nginx service ==="
            sudo systemctl is-active nginx

            echo "=== Tech Katta API proxy directives ==="
            sudo nginx -T 2>/dev/null | sed -n '/server_name[^;]*tech-api\.katta\.cc/,+60p' | grep -E 'server_name|listen|location|proxy_pass|proxy_set_header (Host|X-Forwarded-For|X-Real-IP|CF-Connecting-IP)|proxy_protocol|real_ip_header|set_real_ip_from' || true

            echo "=== Relevant listening ports ==="
            sudo ss -lntp | grep -E ':(22|80|443|5000)([[:space:]]|$)' || true

            echo "=== UFW status ==="
            sudo ufw status verbose || true

            echo "=== API service status ==="
            sudo systemctl is-active tech-katta-api
