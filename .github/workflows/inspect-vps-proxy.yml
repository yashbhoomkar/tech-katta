name: Inspect VPS Proxy Security

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-vps-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-vps-proxy
  cancel-in-progress: true

jobs:
  inspect:
    name: Read-only VPS proxy diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public DNS is proxied by Cloudflare
        shell: bash
        run: |
          python3 - <<'PY'
          import ipaddress
          import socket
          import urllib.request

          host = "tech-api.katta.cc"
          addresses = sorted({
              ipaddress.ip_address(item[4][0])
              for item in socket.getaddrinfo(host, None)
          })
          if not addresses:
              raise SystemExit(f"No DNS addresses found for {host}")

          with urllib.request.urlopen("https://www.cloudflare.com/ips-v4", timeout=10) as response:
              v4_networks = [ipaddress.ip_network(line.strip()) for line in response.read().decode().splitlines() if line.strip()]
          with urllib.request.urlopen("https://www.cloudflare.com/ips-v6", timeout=10) as response:
              v6_networks = [ipaddress.ip_network(line.strip()) for line in response.read().decode().splitlines() if line.strip()]

          all_networks = v4_networks + v6_networks
          print(f"DNS addresses for {host}:")
          for address in addresses:
              proxied = any(address in network for network in all_networks)
              print(f"- {address} (Cloudflare edge: {proxied})")
          if not all(any(address in network for network in all_networks) for address in addresses):
              raise SystemExit("At least one public DNS address does not belong to Cloudflare's official proxy ranges.")
          PY

      - name: Inspect proxy and firewall configuration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            echo "=== Nginx service ==="
            sudo systemctl is-active nginx

            echo "=== Tech Katta API proxy directives ==="
            sudo nginx -T 2>/dev/null | sed -n '/server_name[^;]*tech-api\.katta\.cc/,+60p' | grep -E 'server_name|listen|location|proxy_pass|proxy_set_header (Host|X-Forwarded-For|X-Real-IP|CF-Connecting-IP)|proxy_protocol|real_ip_header|set_real_ip_from' || true

            echo "=== Relevant listening ports ==="
            sudo ss -lntp | grep -E ':(22|80|443|5000)([[:space:]]|$)' || true

            echo "=== UFW status ==="
            sudo ufw status verbose || true

            echo "=== API service status ==="
            sudo systemctl is-active tech-katta-api
