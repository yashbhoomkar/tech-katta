name: Production Browser Smoke (Read-Only)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-browser-smoke.yml"
      - "frontend/**"
      - "scripts/production-browser-smoke.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-smoke
  cancel-in-progress: false

jobs:
  browser-smoke:
    name: Real Chromium browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install isolated Playwright dependency
        run: |
          npm install --prefix /tmp/tech-katta-playwright playwright
          /tmp/tech-katta-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Build frontend for isolated mobile gesture checks
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Start local frontend preview for mobile gesture checks
        run: |
          npm run preview --prefix frontend -- --host 127.0.0.1 --port 4173 > /tmp/tech-katta-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Local frontend preview is ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tech-katta-preview.log
          exit 1

      - name: Test production SPA routes, browser-origin API access, and mobile-emulated swipes
        env:
          PLAYWRIGHT_MODULE: /tmp/tech-katta-playwright/node_modules/playwright/index.mjs
          FRONTEND_URL: https://tech.katta.cc
          API_URL: https://tech-api.katta.cc
          MOBILE_FRONTEND_URL: http://127.0.0.1:4173
        run: node scripts/production-browser-smoke.mjs

      - name: Upload browser-smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke-${{ github.run_id }}
          path: /tmp/tech-katta-preview.log
          if-no-files-found: ignore
          retention-days: 7
