name: Enforce Commit Ledger Unique Indexes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/enforce-ledger-unique-indexes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enforce-commit-ledger-unique-indexes
  cancel-in-progress: false

jobs:
  enforce:
    name: Preflight and enforce unique commit keys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run guarded index migration through VPS runtime credentials
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || '129.121.133.47' }}
          username: ${{ secrets.VPS_USER || 'yash' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            MIGRATION_SCRIPT="/opt/tech-katta/backend/.ledger-unique-migration-${{ github.run_id }}.mjs"
            trap 'sudo -n -u techkatta rm -f "$MIGRATION_SCRIPT" || true' EXIT
            printf '%s\n' 'import '"'"'dotenv/config'"'"';' 'import { MongoClient } from '"'"'mongodb'"'"';' '' 'const uri = process.env.MONGODB_URI;' 'if (!uri) throw new Error('"'"'MONGODB_URI is unavailable; no migration was attempted.'"'"');' '' 'const client = new MongoClient(uri, { serverSelectionTimeoutMS: 5000 });' 'const databaseName = '"'"'techkatta_history'"'"';' 'const backupName = '"'"'commit_ledger_duplicate_backup_20261011'"'"';' 'const collections = ['"'"'frontend_git_commits'"'"', '"'"'backend_git_commits'"'"'];' 'const expectedBackups = [' '  { _id: '"'"'frontend:6acb780fc0d34c06a4bdbc9c'"'"', sourceCollection: '"'"'frontend_git_commits'"'"', originalId: '"'"'6acb780fc0d34c06a4bdbc9c'"'"' },' '  { _id: '"'"'frontend:6acb79744d4d384f7be306f8'"'"', sourceCollection: '"'"'frontend_git_commits'"'"', originalId: '"'"'6acb79744d4d384f7be306f8'"'"' },' '  { _id: '"'"'backend:6acb7805c1d086df8c89e029'"'"', sourceCollection: '"'"'backend_git_commits'"'"', originalId: '"'"'6acb7805c1d086df8c89e029'"'"' },' '  { _id: '"'"'backend:6acb7969c1d086df8c89e02a'"'"', sourceCollection: '"'"'backend_git_commits'"'"', originalId: '"'"'6acb7969c1d086df8c89e02a'"'"' },' '  { _id: '"'"'backend:6acb734cc0d34c06a4bdbc97'"'"', sourceCollection: '"'"'backend_git_commits'"'"', originalId: '"'"'6acb734cc0d34c06a4bdbc97'"'"' },' '  { _id: '"'"'backend:6acb7378c0d34c06a4bdbc98'"'"', sourceCollection: '"'"'backend_git_commits'"'"', originalId: '"'"'6acb7378c0d34c06a4bdbc98'"'"' },' '];' 'const expectedSurvivors = [' '  { collection: '"'"'frontend_git_commits'"'"', key: '"'"'56b229a2c0fa1d586f200a41c79826ed92a0446b'"'"', id: '"'"'6acb780fc0d34c06a4bdbc9c'"'"' },' '  { collection: '"'"'backend_git_commits'"'"', key: '"'"'56b229a2c0fa1d586f200a41c79826ed92a0446b'"'"', id: '"'"'6acb7805c1d086df8c89e029'"'"' },' '  { collection: '"'"'backend_git_commits'"'"', key: '"'"'e4d4f92eee0b033ccbfb5d53928684c0d797bf93'"'"', id: '"'"'6acb734cc0d34c06a4bdbc97'"'"' },' '];' '' 'try {' '  await client.connect();' '  const db = client.db(databaseName);' '  const build = await client.db('"'"'admin'"'"').command({ buildInfo: 1 });' '  const major = Number.parseInt(String(build.version).split('"'"'.'"'"')[0], 10);' '  if (!Number.isFinite(major) || major < 5) {' '    throw new Error('"'"'MongoDB 5.0+ is required for a no-gap replacement of the existing same-key-pattern index.'"'"');' '  }' '  console.log('"'"'MongoDB server version:'"'"', build.version);' '' '  // Verify the complete backup set before touching indexes.' '  const backup = db.collection(backupName);' '  const backupDocs = await backup.find({ _id: { $in: expectedBackups.map(({ _id }) => _id) } }).toArray();' '  if (backupDocs.length !== expectedBackups.length) {' '    throw new Error(`Backup verification failed: expected ${expectedBackups.length} known duplicate backups, found ${backupDocs.length}. No index changes made.`);' '  }' '  for (const expected of expectedBackups) {' '    const actual = backupDocs.find(({ _id }) => _id === expected._id);' '    if (!actual || actual.sourceCollection !== expected.sourceCollection || actual.originalId !== expected.originalId) {' '      throw new Error(`Backup metadata mismatch for ${expected._id}. No index changes made.`);' '    }' '  }' '  console.log('"'"'Verified all six expected duplicate backup records.'"'"');' '' '  // Preflight both collections before applying any index change.' '  for (const name of collections) {' '    const collection = db.collection(name);' '    const duplicateKeys = await collection.aggregate([' '      { $group: { _id: '"'"'$key'"'"', count: { $sum: 1 } } },' '      { $match: { count: { $gt: 1 } } },' '      { $limit: 10 },' '    ]).toArray();' '    if (duplicateKeys.length) {' '      throw new Error(`Duplicate keys remain in ${name}: ${JSON.stringify(duplicateKeys)}. No index changes made.`);' '    }' '    const malformed = await collection.countDocuments({ $expr: { $ne: [{ $type: '"'"'$key'"'"' }, '"'"'string'"'"'] } });' '    if (malformed !== 0) {' '      throw new Error(`${name} contains ${malformed} rows without a string key. No index changes made.`);' '    }' '    console.log(`${name}: duplicate-key and key-type preflight passed.`);' '  }' '' '  // Confirm the surviving rows for the historical duplicate SHAs match the preserved backup.' '  for (const expected of expectedSurvivors) {' '    const rows = await db.collection(expected.collection).find({ key: expected.key }).project({ _id: 1 }).toArray();' '    if (rows.length !== 1 || String(rows[0]._id) !== expected.id) {' '      throw new Error(`Expected exactly the preserved survivor ${expected.id} for ${expected.key} in ${expected.collection}; found ${JSON.stringify(rows.map(({ _id }) => String(_id)))}. No index changes made.`);' '    }' '  }' '  console.log('"'"'Historical duplicate SHA survivors match the preserved backup ledger.'"'"');' '' '  // Create and verify unique indexes before dropping the redundant non-unique indexes.' '  for (const name of collections) {' '    const collection = db.collection(name);' '    let indexes = await collection.listIndexes().toArray();' '    let uniqueKeyIndex = indexes.find((index) =>' '      index.key?.key === 1 && Object.keys(index.key).length === 1 && index.unique === true' '    );' '' '    if (!uniqueKeyIndex) {' '      await collection.createIndex({ key: 1 }, { name: '"'"'key_unique_enforced'"'"', unique: true });' '      indexes = await collection.listIndexes().toArray();' '      uniqueKeyIndex = indexes.find((index) =>' '        index.key?.key === 1 && Object.keys(index.key).length === 1 && index.unique === true' '      );' '    }' '    if (!uniqueKeyIndex) {' '      throw new Error(`Unique index could not be verified for ${name}; leaving the legacy index in place.`);' '    }' '' '    const redundant = indexes.find((index) =>' '      index.name === '"'"'key_unique'"'"' && index.unique !== true && index.name !== uniqueKeyIndex.name' '    );' '    if (redundant) await collection.dropIndex(redundant.name);' '' '    const finalIndexes = await collection.listIndexes().toArray();' '    const finalUnique = finalIndexes.find((index) =>' '      index.key?.key === 1 && Object.keys(index.key).length === 1 && index.unique === true' '    );' '    if (!finalUnique) throw new Error(`Final verification failed: ${name} has no enforced unique key index.`);' '    if (finalIndexes.some((index) => index.name === '"'"'key_unique'"'"' && index.unique !== true)) {' '      throw new Error(`Redundant non-unique key_unique index remains in ${name}.`);' '    }' '    console.log(`${name}: verified unique index ${finalUnique.name}; redundant non-unique index removed if present.`);' '  }' '' '  console.log('"'"'SUCCESS: both canonical commit ledgers now enforce unique string keys. No ledger documents were deleted or modified by this workflow.'"'"');' '} finally {' '  await client.close();' '}' '' | sudo -n -u techkatta tee "$MIGRATION_SCRIPT" >/dev/null
            sudo -n -u techkatta bash -lc "cd /opt/tech-katta/backend && node '$MIGRATION_SCRIPT'"
