<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Kafka component diagram</title>
  <desc id="desc">A simple component diagram showing producer services publishing events to a Kafka topic divided into three partitions, which a consumer group reads.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#2855D9"/>
    </marker>
    <style>
      .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; fill: #586575; }
      .heading { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #1C2733; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 14px; fill: #586575; }
      .mono { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; fill: #1C2733; }
      .component { fill: #FFFFFF; stroke: #1C2733; stroke-width: 1.25; }
      .subcomponent { fill: #F5F7FA; stroke: #D9DEE7; stroke-width: 1; }
      .accent { fill: #F5F7FA; stroke: #2855D9; stroke-width: 1.5; }
      .flow { fill: none; stroke: #2855D9; stroke-width: 1.6; marker-end: url(#arrow); }
      .rule { stroke: #D9DEE7; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text x="40" y="42" class="eyebrow">FIG 1.0 / EVENT STREAMING</text>
  <text x="40" y="76" class="heading" style="font-size:26px">Kafka — component overview</text>
  <text x="40" y="101" class="body">Producers write events to partitioned topics; consumer groups read them.</text>
  <line x1="40" y1="122" x2="1160" y2="122" class="rule"/>

  <!-- Producer component -->
  <rect x="40" y="184" width="220" height="226" rx="2" class="component"/>
  <rect x="40" y="184" width="220" height="36" fill="#F5F7FA"/>
  <line x1="40" y1="220" x2="260" y2="220" class="rule"/>
  <text x="56" y="207" class="eyebrow">01 / PRODUCE</text>
  <text x="56" y="252" class="heading">Producer services</text>
  <text x="56" y="276" class="body">Publish events</text>
  <rect x="56" y="300" width="188" height="38" rx="2" class="subcomponent"/>
  <text x="70" y="324" class="mono">Orders API</text>
  <rect x="56" y="348" width="188" height="38" rx="2" class="subcomponent"/>
  <text x="70" y="372" class="mono">Activity service</text>

  <!-- Produce connection -->
  <path d="M260 296 H354" class="flow"/>
  <text x="307" y="281" text-anchor="middle" class="eyebrow">PRODUCE</text>

  <!-- Kafka cluster component -->
  <rect x="370" y="156" width="460" height="282" rx="2" class="component"/>
  <rect x="370" y="156" width="460" height="42" fill="#F5F7FA"/>
  <line x1="370" y1="198" x2="830" y2="198" class="rule"/>
  <text x="388" y="182" class="eyebrow">02 / KAFKA CLUSTER</text>
  <text x="388" y="230" class="heading">Topic: orders.events</text>
  <text x="388" y="253" class="body">Ordered records distributed across partitions</text>

  <rect x="388" y="276" width="132" height="76" rx="2" class="accent"/>
  <text x="454" y="306" class="eyebrow" text-anchor="middle" style="fill:#2855D9">PARTITION</text>
  <text x="454" y="333" class="heading" text-anchor="middle">P0</text>

  <rect x="534" y="276" width="132" height="76" rx="2" class="accent"/>
  <text x="600" y="306" class="eyebrow" text-anchor="middle" style="fill:#2855D9">PARTITION</text>
  <text x="600" y="333" class="heading" text-anchor="middle">P1</text>

  <rect x="680" y="276" width="132" height="76" rx="2" class="accent"/>
  <text x="746" y="306" class="eyebrow" text-anchor="middle" style="fill:#2855D9">PARTITION</text>
  <text x="746" y="333" class="heading" text-anchor="middle">P2</text>

  <line x1="388" y1="372" x2="812" y2="372" class="rule"/>
  <text x="388" y="398" class="mono">Topic partitions enable parallel reads</text>
  <text x="388" y="418" class="body">Replication and broker placement omitted for clarity.</text>

  <!-- Consume connection -->
  <path d="M830 296 H924" class="flow"/>
  <text x="877" y="281" text-anchor="middle" class="eyebrow">CONSUME</text>

  <!-- Consumer group component -->
  <rect x="940" y="184" width="220" height="226" rx="2" class="component"/>
  <rect x="940" y="184" width="220" height="36" fill="#F5F7FA"/>
  <line x1="940" y1="220" x2="1160" y2="220" class="rule"/>
  <text x="956" y="207" class="eyebrow">03 / CONSUME</text>
  <text x="956" y="252" class="heading">Consumer group</text>
  <text x="956" y="276" class="body">Read events</text>
  <rect x="956" y="300" width="188" height="38" rx="2" class="subcomponent"/>
  <text x="970" y="324" class="mono">Consumer A · P0</text>
  <rect x="956" y="348" width="188" height="38" rx="2" class="subcomponent"/>
  <text x="970" y="372" class="mono">Consumer B · P1/P2</text>

  <!-- Footer facts -->
  <line x1="40" y1="466" x2="1160" y2="466" class="rule"/>
  <text x="40" y="493" class="eyebrow">CORE CONCEPTS</text>
  <text x="40" y="520" class="body">Topics group events.</text>
  <text x="330" y="520" class="body">Partitions provide ordered logs.</text>
  <text x="700" y="520" class="body">Consumer groups enable parallel processing.</text>
</svg>