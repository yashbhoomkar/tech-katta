<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Kafka event streaming architecture</title>
  <desc id="desc">Applications publish events through producers to a Kafka cluster. Three brokers store topic partitions, and a consumer group reads the stream.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e9edf4" stroke-width="1"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2869bd"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#168b8b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1d2b45" flood-opacity=".07"/>
    </filter>
    <style>
      .eyebrow{font:600 13px 'DM Mono',monospace;letter-spacing:2px;fill:#2869bd}
      .heading{font:600 22px Inter,Arial,sans-serif;fill:#1c2738}
      .body{font:14px Inter,Arial,sans-serif;fill:#526078}
      .small{font:12px 'DM Mono',monospace;letter-spacing:.3px;fill:#627089}
      .box{fill:#fff;stroke:#cbd5e3;stroke-width:1.5}
      .bluebox{fill:#edf4ff;stroke:#a8c5ee;stroke-width:1.5}
      .tealbox{fill:#e9f8f5;stroke:#9dd8cb;stroke-width:1.5}
      .partition{stroke:#fff;stroke-width:2}
    </style>
  </defs>
  <rect width="1440" height="760" rx="18" fill="#f8faff"/>
  <rect width="1440" height="760" rx="18" fill="url(#grid)"/>
  <text x="56" y="52" class="eyebrow">EVENT STREAMING / REFERENCE ARCHITECTURE</text>
  <text x="56" y="88" class="heading" font-size="28">From producers to consumers</text>
  <text x="56" y="116" class="body">Kafka stores ordered event logs across broker-hosted topic partitions.</text>

  <!-- Producers -->
  <g filter="url(#shadow)">
    <rect x="56" y="230" width="228" height="280" rx="14" class="box"/>
    <rect x="56" y="230" width="228" height="8" rx="4" fill="#2869bd"/>
  </g>
  <text x="80" y="274" class="eyebrow">01 / WRITE PATH</text>
  <text x="80" y="307" class="heading">Producers</text>
  <text x="80" y="333" class="body">Services publish events</text>
  <rect x="80" y="360" width="180" height="46" rx="8" class="bluebox"/>
  <circle cx="98" cy="383" r="5" fill="#2869bd"/>
  <text x="113" y="388" class="body" font-weight="600">Orders service</text>
  <rect x="80" y="418" width="180" height="46" rx="8" class="bluebox"/>
  <circle cx="98" cy="441" r="5" fill="#2869bd"/>
  <text x="113" y="446" class="body" font-weight="600">Activity service</text>
  <text x="80" y="488" class="small">KEY → PARTITION</text>

  <!-- Producer flow -->
  <path d="M284 383H364" stroke="#2869bd" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="304" y="365" class="small">produce</text>

  <!-- Kafka cluster container -->
  <rect x="376" y="176" width="690" height="390" rx="18" fill="#fff" stroke="#b9c8dc" stroke-width="1.5" stroke-dasharray="7 6"/>
  <rect x="400" y="194" width="242" height="34" rx="17" fill="#eaf1fb"/>
  <text x="421" y="216" class="eyebrow">02 / KAFKA CLUSTER</text>
  <text x="1038" y="216" class="small" text-anchor="end">3 BROKERS · REPLICATED LOGS</text>

  <!-- Broker 1 -->
  <g filter="url(#shadow)">
    <rect x="400" y="254" width="202" height="268" rx="12" class="box"/>
  </g>
  <rect x="400" y="254" width="202" height="48" rx="12" fill="#edf4ff"/>
  <path d="M400 290V302H602V290" fill="#edf4ff"/>
  <circle cx="422" cy="278" r="6" fill="#2869bd"/>
  <text x="438" y="283" class="body" font-weight="600">Broker 1</text>
  <text x="420" y="328" class="small">TOPIC: ORDERS</text>
  <rect x="420" y="342" width="162" height="38" rx="6" fill="#2869bd"/>
  <text x="501" y="366" fill="#fff" font-family="DM Mono,monospace" font-size="13" text-anchor="middle">P0 · leader</text>
  <rect x="420" y="389" width="162" height="38" rx="6" fill="#dce9fb"/>
  <text x="501" y="413" fill="#234c86" font-family="DM Mono,monospace" font-size="13" text-anchor="middle">P3 · replica</text>
  <text x="420" y="463" class="small">APPEND-ONLY LOG</text>
  <path d="M420 478H582" stroke="#d7dfeb" stroke-width="1.5"/>
  <text x="420" y="499" class="small">OFFSET  →  0 … N</text>

  <!-- Broker 2 -->
  <g filter="url(#shadow)">
    <rect x="620" y="254" width="202" height="268" rx="12" class="box"/>
  </g>
  <rect x="620" y="254" width="202" height="48" rx="12" fill="#e9f8f5"/>
  <path d="M620 290V302H822V290" fill="#e9f8f5"/>
  <circle cx="642" cy="278" r="6" fill="#168b8b"/>
  <text x="658" y="283" class="body" font-weight="600">Broker 2</text>
  <text x="640" y="328" class="small">TOPIC: ORDERS</text>
  <rect x="640" y="342" width="162" height="38" rx="6" fill="#168b8b"/>
  <text x="721" y="366" fill="#fff" font-family="DM Mono,monospace" font-size="13" text-anchor="middle">P1 · leader</text>
  <rect x="640" y="389" width="162" height="38" rx="6" fill="#d5f0e9"/>
  <text x="721" y="413" fill="#17645f" font-family="DM Mono,monospace" font-size="13" text-anchor="middle">P0 · replica</text>
  <text x="640" y="463" class="small">APPEND-ONLY LOG</text>
  <path d="M640 478H802" stroke="#d7dfeb" stroke-width="1.5"/>
  <text x="640" y="499" class="small">OFFSET  →  0 … N</text>

  <!-- Broker 3 -->
  <g filter="url(#shadow)">
    <rect x="840" y="254" width="202" height="268" rx="12" class="box"/>
  </g>
  <rect x="840" y="254" width="202" height="48" rx="12" fill="#f4edff"/>
  <path d="M840 290V302H1042V290" fill="#f4edff"/>
  <circle cx="862" cy="278" r="6" fill="#8257c8"/>
  <text x="878" y="283" class="body" font-weight="600">Broker 3</text>
  <text x="860" y="328" class="small">TOPIC: ORDERS</text>
  <rect x="860" y="342" width="162" height="38" rx="6" fill="#8257c8"/>
  <text x="941" y="366" fill="#fff" font-family="DM Mono,monospace" font-size="13" text-anchor="middle">P2 · leader</text>
  <rect x="860" y="389" width="162" height="38" rx="6" fill="#e9e0fa"/>
  <text x="941" y="413" fill="#5d4294" font-family="DM Mono,monospace" font-size="13" text-anchor="middle">P1 · replica</text>
  <text x="860" y="463" class="small">APPEND-ONLY LOG</text>
  <path d="M860 478H1022" stroke="#d7dfeb" stroke-width="1.5"/>
  <text x="860" y="499" class="small">OFFSET  →  0 … N</text>

  <!-- Consumer flow -->
  <path d="M1066 383H1140" stroke="#168b8b" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/>
  <text x="1080" y="365" class="small">consume</text>

  <!-- Consumer group -->
  <g filter="url(#shadow)">
    <rect x="1152" y="230" width="232" height="302" rx="14" class="box"/>
    <rect x="1152" y="230" width="232" height="8" rx="4" fill="#168b8b"/>
  </g>
  <text x="1176" y="274" class="eyebrow">03 / READ PATH</text>
  <text x="1176" y="307" class="heading">Consumer group</text>
  <text x="1176" y="333" class="body">Each partition assigned</text>
  <rect x="1176" y="360" width="184" height="38" rx="8" class="tealbox"/>
  <circle cx="1194" cy="379" r="5" fill="#168b8b"/>
  <text x="1208" y="384" class="body" font-weight="600">Consumer A · P0</text>
  <rect x="1176" y="407" width="184" height="38" rx="8" class="tealbox"/>
  <circle cx="1194" cy="426" r="5" fill="#168b8b"/>
  <text x="1208" y="431" class="body" font-weight="600">Consumer B · P1</text>
  <rect x="1176" y="454" width="184" height="38" rx="8" class="tealbox"/>
  <circle cx="1194" cy="473" r="5" fill="#168b8b"/>
  <text x="1208" y="478" class="body" font-weight="600">Consumer C · P2</text>
  <text x="1176" y="515" class="small">ORDER WITHIN PARTITION</text>

  <!-- Key properties -->
  <rect x="56" y="612" width="1328" height="94" rx="12" fill="#eef3fa" stroke="#d7e0ed"/>
  <g>
    <text x="80" y="644" class="eyebrow">KEY IDEA</text>
    <text x="80" y="674" class="body" font-weight="600">Topics are split into partitions.</text>
    <text x="80" y="695" class="small">Partitions distribute storage and parallel work.</text>
  </g>
  <path d="M470 630V688" stroke="#d1dbe9" stroke-width="1.5"/>
  <g>
    <text x="502" y="644" class="eyebrow">DURABILITY</text>
    <text x="502" y="674" class="body" font-weight="600">Brokers persist ordered records.</text>
    <text x="502" y="695" class="small">Replication supports recovery from broker failure.</text>
  </g>
  <path d="M920 630V688" stroke="#d1dbe9" stroke-width="1.5"/>
  <g>
    <text x="952" y="644" class="eyebrow">SCALING</text>
    <text x="952" y="674" class="body" font-weight="600">Consumer groups process in parallel.</text>
    <text x="952" y="695" class="small">A partition is assigned to one group member at a time.</text>
  </g>
</svg>