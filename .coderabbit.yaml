language: en-US

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches:
      - main
  path_instructions:
    - path: "backend/**"
      instructions: |
        Review for correctness, security, reliability, and compatibility with the deployed single-VPS topology.
        Pay particular attention to Express trust proxy and request.ip assumptions, rate limiting, CORS,
        input validation, MongoDB query semantics, fallback behavior, timeouts, error handling, secret handling,
        and changes that could alter existing API response contracts. Treat direct client -> Nginx -> Express
        as the current topology unless repository evidence proves otherwise. Do not recommend trusting
        forwarded headers from untrusted peers.
    - path: "frontend/src/**"
      instructions: |
        Review React state/effect dependencies, stale closures, route and browser-history behavior,
        touch/swipe interactions, mobile layouts, keyboard/accessibility behavior, API error/fallback paths,
        and compatibility with the current article/category schema. Preserve existing substring search
        semantics unless the PR explicitly changes and tests the contract.
    - path: "backend/test/**"
      instructions: |
        Prioritize meaningful regression coverage, edge cases, cleanup of timers/listeners/servers,
        deterministic tests, and parity between MongoDB and fallback behavior. Do not accept a test that
        merely asserts a mock without exercising the relevant contract.
    - path: "scripts/**"
      instructions: |
        Check safety boundaries, bounded request volume, timeouts, cleanup, accurate claims, and whether
        a script is read-only or mutates production. Production probes must not disable TLS verification,
        send unbounded traffic, or print secrets.
    - path: ".github/workflows/**"
      instructions: |
        Review permissions for least privilege, pinned or trusted actions, secret exposure, trigger scope,
        concurrency, timeouts, shell/YAML correctness, and whether workflow names/results accurately
        distinguish static analysis, unit tests, browser smoke tests, load baselines, and capacity tests.
    - path: "frontend/**"
      instructions: |
        Preserve existing UI and route contracts. Flag risky behavior changes and missing tests, but avoid
        style-only or speculative comments unless they materially affect usability, accessibility, or maintenance.

chat:
  auto_reply: false
